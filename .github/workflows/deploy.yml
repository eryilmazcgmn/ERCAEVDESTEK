name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Google Cloud VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ -d "$HOME/ERCAEVDESTEK" ]; then
              cd "$HOME/ERCAEVDESTEK"
            elif [ -d "/var/www/ERCAEVDESTEK" ]; then
              cd "/var/www/ERCAEVDESTEK"
            elif [ -d "$HOME/projects/ERCAEVDESTEK" ]; then
              cd "$HOME/projects/ERCAEVDESTEK"
            else
              echo "Project directory not found!"
              exit 1
            fi
            chmod +x deploy.sh
            git pull origin main
            ./deploy.sh
